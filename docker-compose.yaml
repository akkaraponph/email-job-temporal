version: '3.8'
services:
  email-service:
    image: akkaraponph/email-service:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      - TZ=Asia/Bangkok
    depends_on:
      - temporal-worker

  temporal-worker:
    image: akkaraponph/temporal-worker:latest
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      - TZ=Asia/Bangkok
